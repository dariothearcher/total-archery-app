<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Replaced by the value of `--base-href` in `flutter build web`. -->
  <base href="/total-archery-app/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="L'app per chi tira con l'arco: segna le frecce, guarda come tiri, migliora. I dati restano sul tuo dispositivo.">
  <meta name="theme-color" content="#1D5A3A">

  <!-- iOS: added to the Home Screen, it opens like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Total Archery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Total Archery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* While the app loads: the green of the app with its mark. */
    html, body { margin: 0; height: 100%; background: #1D5A3A; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; }
    .loading img { width: 96px; height: 96px; border-radius: 22px; opacity: .9; }
  </style>
</head>
<body>
  <div class="loading" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
